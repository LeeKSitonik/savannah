# fly.toml app configuration file generated for savannah on 2026-10-04T00:40:35+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'savannah'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

  [mounts]
  source = "clinic_sqlite_data"
  destination = "/var/data"

[env]
  DATA_DIR = "/var/data"